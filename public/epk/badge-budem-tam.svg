<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Royal Golden Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#A27B1C" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA7C11" />
      <stop offset="50%" stop-color="#FDF3CD" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <radialGradient id="shieldBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141312" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#080808" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.98" />
    </radialGradient>
    
    <!-- Premium Drop Shadow -->
    <filter id="luxuryShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark glassmorphic background plate -->
  <circle cx="200" cy="200" r="185" fill="url(#shieldBg)" filter="url(#luxuryShadow)" stroke="url(#goldGrad)" stroke-width="1.5" />
  
  <!-- Outer complex luxury geometry (scalloped circle/star) -->
  <circle cx="200" cy="200" r="172" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="12 6" stroke-linecap="round" />
  
  <!-- Framing rings -->
  <circle cx="200" cy="200" r="162" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="200" cy="200" r="132" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Circular Text Path Definition (Arch) -->
  <path id="textArchTop" fill="none" d="M 58,200 A 142,142 0 0,1 342,200" />
  <path id="textArchBottom" fill="none" d="M 342,200 A 142,142 0 0,1 58,200" />

  <!-- Event/Check-in Typography -->
  <text font-family="'Outfit', 'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="22" fill="url(#goldGlow)" letter-spacing="5.5" filter="url(#glowEffect)">
    <textPath href="#textArchTop" startOffset="50%" text-anchor="middle">BUDEM TAM!</textPath>
  </text>
  
  <text font-family="'Outfit', 'Inter', 'Montserrat', sans-serif" font-weight="600" font-size="12" fill="#FFFFFF" letter-spacing="7" opacity="0.8">
    <textPath href="#textArchBottom" startOffset="50%" text-anchor="middle">• ELLEGANCE FAMILY •</textPath>
  </text>

  <!-- Centered Glowing Luxury Checkmark -->
  <g transform="translate(200, 192) scale(0.9)">
    <!-- Intricate gold framing shield behind checkmark -->
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4" />
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2 4" opacity="0.6" />
    
    <!-- Polished Vector Checkmark with drop shadow and glow -->
    <path d="M -22,0 L -5,17 L 22,-14" fill="none" stroke="url(#goldGlow)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.5))" />
    <path d="M -22,0 L -5,17 L 22,-14" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  </g>
  
  <!-- Tiny decorative stars framing the bottom text -->
  <g fill="url(#goldGrad)">
    <polygon points="62,200 65,195 70,195 66,198 67,203 62,200 57,203 58,198 54,195 59,195" opacity="0.8"/>
    <polygon points="338,200 341,195 346,195 342,198 343,203 338,200 333,203 334,198 330,195 335,195" opacity="0.8"/>
  </g>
</svg>
